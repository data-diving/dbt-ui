# The scheme users opened dbt UI with: what a TLS proxy in front of this nginx reports, else our own
map $http_x_forwarded_proto $dbtui_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing static files (paths with a file extension) are a real 404, not the SPA page:
    # e.g. /favicon.ico must not return HTML, or browsers show no icon
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # Proxy API requests to backend (^~: takes precedence over the regex location above)
    location ^~ /api/ {
        proxy_pass ${DBT_UI__BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $dbtui_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
