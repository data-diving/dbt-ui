[project]
name = "dbt-ui-backend"
version = "0.1.1"
description = "dbt-ui Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "python-multipart==0.0.33",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "metadv>=0.1.0",
    # Scheduler (only active when DBT_UI__SCHEDULER_ENABLED=true)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pg8000>=1.30",
    "cryptography>=42.0",
    "croniter>=2.0",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[tool.uv]
# This is not a package, just a dependency list
package = false
